<!-- Theme is applied before first paint so a returning visitor never sees the
     wrong palette flash. Deliberately inline and before the stylesheets. -->
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem("dl.theme"); } catch (e) { /* private mode */ }
  var theme = stored || (window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<header class="masthead">
  <a class="mark" href="#/today">daily<em>·</em>learn</a>

<p class="prototype-note" id="prototype-note">

  <span><strong>M1 — look and structure.</strong> Navigation, the theme and today's pick

    states; they persist from M2. Search, filters and the shuffle roll are drawn, not wired.</span>
  <button type="button" id="prototype-note-close">Dismiss</button>
</p>
